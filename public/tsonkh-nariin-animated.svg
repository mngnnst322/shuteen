<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 560" width="450" height="560">
  <defs>
    <linearGradient id="frameOuter" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#f2f4f6"/>
      <stop offset="1" stop-color="#dfe3e8"/>
    </linearGradient>
    <linearGradient id="frameInner" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8ebee"/>
      <stop offset="0.5" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eceff2"/>
    </linearGradient>
    <linearGradient id="sash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#f5f7f9"/>
      <stop offset="1" stop-color="#e2e6ea"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef4fa"/>
      <stop offset="0.45" stop-color="#e2ecf5"/>
      <stop offset="1" stop-color="#d5e2ee"/>
    </linearGradient>
    <linearGradient id="glassSheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="0.4" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="handle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#e9ecef"/>
      <stop offset="1" stop-color="#cfd5db"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0b0f2b" flood-opacity="0.14"/>
    </filter>
    <filter id="tinyShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#0b0f2b" flood-opacity="0.25"/>
    </filter>
  </defs>

  <style>
    .sash-narrow {
      transform-origin: 44px 280px;
      animation: openN 6s ease-in-out infinite;
    }
    .interior-n { animation: darkN 6s ease-in-out infinite; }

    @keyframes openN {
      0%, 15%  { transform: scaleX(1) skewY(0deg); }
      45%, 60% { transform: scaleX(0.3) skewY(-6deg); }
      90%, 100%{ transform: scaleX(1) skewY(0deg); }
    }
    @keyframes darkN {
      0%, 15% { opacity: 0; } 45%, 60% { opacity: 1; } 90%, 100% { opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .sash-narrow, .interior-n { animation: none; }
    }
  </style>

  <g transform="scale(1.5,1)">
    <!-- Outer frame -->
    <g filter="url(#softShadow)">
      <rect x="14" y="30" width="272" height="500" rx="6" fill="url(#frameOuter)" stroke="#c7ccd2" stroke-width="1.5"/>
    </g>
    <rect x="32" y="52" width="236" height="456" rx="4" fill="url(#frameInner)" stroke="#c2c8ce" stroke-width="1"/>
    <rect x="40" y="60" width="220" height="440" rx="3" fill="none" stroke="#aeb5bc" stroke-width="1.5"/>

    <!-- Нээгдэхэд харагдах дотор орчин -->
    <rect class="interior-n" x="44" y="64" width="212" height="432" fill="#2a3242" opacity="0"/>

    <!-- Нарийн хавтас — нугас зүүн талд -->
    <g class="sash-narrow">
      <rect x="44" y="64" width="212" height="432" rx="3" fill="url(#sash)" stroke="#bfc5cb" stroke-width="1.5"/>
      <rect x="62" y="82" width="176" height="396" rx="2" fill="#eef1f4" stroke="#b4bac1" stroke-width="1"/>
      <rect x="70" y="90" width="160" height="380" fill="url(#glass)" stroke="#9fb3c6" stroke-width="1"/>
      <polygon points="70,90 132,90 88,470 70,470" fill="url(#glassSheen)"/>
      <polygon points="152,90 180,90 116,470 96,470" fill="#ffffff" opacity="0.22"/>
      <!-- Нугас -->
      <rect x="38" y="105" width="8" height="32" rx="2" fill="#d6dade" stroke="#b0b6bc" stroke-width="0.8"/>
      <rect x="38" y="423" width="8" height="32" rx="2" fill="#d6dade" stroke="#b0b6bc" stroke-width="0.8"/>
      <!-- Бариул баруун талд -->
      <g filter="url(#tinyShadow)">
        <rect x="236" y="258" width="13" height="24" rx="4" fill="url(#handle)" stroke="#b8bec5" stroke-width="1"/>
        <rect x="239" y="269" width="7" height="64" rx="3.5" fill="url(#handle)" stroke="#b8bec5" stroke-width="1"/>
      </g>
    </g>
  </g>
</svg>
