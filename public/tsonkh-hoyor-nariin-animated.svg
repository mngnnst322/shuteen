<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 560" width="460" height="560">
  <defs>
    <linearGradient id="frameOuter" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#f2f4f6"/>
      <stop offset="1" stop-color="#dfe3e8"/>
    </linearGradient>
    <linearGradient id="frameInner" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8ebee"/>
      <stop offset="0.5" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eceff2"/>
    </linearGradient>
    <linearGradient id="sash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#f5f7f9"/>
      <stop offset="1" stop-color="#e2e6ea"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef4fa"/>
      <stop offset="0.45" stop-color="#e2ecf5"/>
      <stop offset="1" stop-color="#d5e2ee"/>
    </linearGradient>
    <linearGradient id="glassSheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="0.4" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="handle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#e9ecef"/>
      <stop offset="1" stop-color="#cfd5db"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0b0f2b" flood-opacity="0.14"/>
    </filter>
    <filter id="tinyShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#0b0f2b" flood-opacity="0.25"/>
    </filter>
  </defs>

  <style>
    .sash-l2n, .sash-r2n {
      animation-duration: 6s;
      animation-iteration-count: infinite;
      animation-timing-function: ease-in-out;
    }
    .sash-l2n { transform-origin: 58px 280px;  animation-name: openL2n; }
    .sash-r2n { transform-origin: 402px 280px; animation-name: openR2n; }
    .int-l2n { animation: dkL2n 6s ease-in-out infinite; }
    .int-r2n { animation: dkR2n 6s ease-in-out infinite; }

    @keyframes openL2n {
      0%, 15%  { transform: scaleX(1) skewY(0deg); }
      45%, 60% { transform: scaleX(0.3) skewY(-6deg); }
      90%, 100%{ transform: scaleX(1) skewY(0deg); }
    }
    @keyframes openR2n {
      0%, 15%  { transform: scaleX(1) skewY(0deg); }
      45%, 60% { transform: scaleX(0.3) skewY(6deg); }
      90%, 100%{ transform: scaleX(1) skewY(0deg); }
    }
    @keyframes dkL2n { 0%, 15% { opacity: 0; } 45%, 60% { opacity: 1; } 90%, 100% { opacity: 0; } }
    @keyframes dkR2n { 0%, 15% { opacity: 0; } 45%, 60% { opacity: 1; } 90%, 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .sash-l2n, .sash-r2n, .int-l2n, .int-r2n { animation: none; }
    }
  </style>

  <!-- Outer frame -->
  <g filter="url(#softShadow)">
    <rect x="26" y="30" width="408" height="500" rx="6" fill="url(#frameOuter)" stroke="#c7ccd2" stroke-width="1.5"/>
  </g>
  <rect x="46" y="52" width="368" height="456" rx="4" fill="url(#frameInner)" stroke="#c2c8ce" stroke-width="1"/>
  <rect x="54" y="60" width="352" height="440" rx="3" fill="none" stroke="#aeb5bc" stroke-width="1.5"/>

  <!-- Дотор орчин -->
  <rect class="int-l2n" x="58"  y="64" width="165" height="432" fill="#2a3242" opacity="0"/>
  <rect class="int-r2n" x="237" y="64" width="165" height="432" fill="#2a3242" opacity="0"/>

  <!-- Голын хуваалт -->
  <rect x="223" y="64" width="14" height="432" fill="url(#frameOuter)" stroke="#bfc5cb" stroke-width="1"/>

  <!-- ЗҮҮН нарийн хавтас — нугас зүүн талд -->
  <g class="sash-l2n">
    <rect x="58" y="64" width="165" height="432" rx="3" fill="url(#sash)" stroke="#bfc5cb" stroke-width="1.5"/>
    <rect x="74" y="80" width="133" height="400" rx="2" fill="#eef1f4" stroke="#b4bac1" stroke-width="1"/>
    <rect x="81" y="87" width="119" height="386" fill="url(#glass)" stroke="#9fb3c6" stroke-width="1"/>
    <polygon points="81,87 128,87 96,473 81,473" fill="url(#glassSheen)"/>
    <polygon points="144,87 165,87 118,473 103,473" fill="#ffffff" opacity="0.22"/>
    <rect x="52" y="105" width="8" height="30" rx="2" fill="#d6dade" stroke="#b0b6bc" stroke-width="0.8"/>
    <rect x="52" y="425" width="8" height="30" rx="2" fill="#d6dade" stroke="#b0b6bc" stroke-width="0.8"/>
    <g filter="url(#tinyShadow)">
      <rect x="204" y="260" width="12" height="22" rx="4" fill="url(#handle)" stroke="#b8bec5" stroke-width="1"/>
      <rect x="207" y="270" width="6" height="58" rx="3" fill="url(#handle)" stroke="#b8bec5" stroke-width="1"/>
    </g>
  </g>

  <!-- БАРУУН нарийн хавтас — нугас баруун талд -->
  <g class="sash-r2n">
    <rect x="237" y="64" width="165" height="432" rx="3" fill="url(#sash)" stroke="#bfc5cb" stroke-width="1.5"/>
    <rect x="253" y="80" width="133" height="400" rx="2" fill="#eef1f4" stroke="#b4bac1" stroke-width="1"/>
    <rect x="260" y="87" width="119" height="386" fill="url(#glass)" stroke="#9fb3c6" stroke-width="1"/>
    <polygon points="260,87 307,87 275,473 260,473" fill="url(#glassSheen)"/>
    <polygon points="323,87 344,87 297,473 282,473" fill="#ffffff" opacity="0.22"/>
    <rect x="400" y="105" width="8" height="30" rx="2" fill="#d6dade" stroke="#b0b6bc" stroke-width="0.8"/>
    <rect x="400" y="425" width="8" height="30" rx="2" fill="#d6dade" stroke="#b0b6bc" stroke-width="0.8"/>
    <g filter="url(#tinyShadow)">
      <rect x="244" y="260" width="12" height="22" rx="4" fill="url(#handle)" stroke="#b8bec5" stroke-width="1"/>
      <rect x="247" y="270" width="6" height="58" rx="3" fill="url(#handle)" stroke="#b8bec5" stroke-width="1"/>
    </g>
  </g>
</svg>
