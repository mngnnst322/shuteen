<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" width="640" height="560">
  <defs>
    <linearGradient id="frameOuter" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#f2f4f6"/>
      <stop offset="1" stop-color="#dfe3e8"/>
    </linearGradient>
    <linearGradient id="frameInner" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8ebee"/>
      <stop offset="0.5" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eceff2"/>
    </linearGradient>
    <linearGradient id="sash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#f5f7f9"/>
      <stop offset="1" stop-color="#e2e6ea"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef4fa"/>
      <stop offset="0.45" stop-color="#e2ecf5"/>
      <stop offset="1" stop-color="#d5e2ee"/>
    </linearGradient>
    <linearGradient id="glassSheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="0.4" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="handle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#e9ecef"/>
      <stop offset="1" stop-color="#cfd5db"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0b0f2b" flood-opacity="0.14"/>
    </filter>
    <filter id="tinyShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#0b0f2b" flood-opacity="0.25"/>
    </filter>
  </defs>

  <style>
    .sash-l, .sash-r, .sash-m {
      animation-duration: 7s;
      animation-iteration-count: infinite;
      animation-timing-function: ease-in-out;
    }
    .sash-l { transform-origin: 60px 280px;  animation-name: openL3n; }
    .sash-r { transform-origin: 580px 280px; animation-name: openR3n; }
    .sash-m { transform-origin: 320px 496px; animation-name: tiltM3n; }
    .int-l { animation: dkL3n 7s ease-in-out infinite; }
    .int-r { animation: dkR3n 7s ease-in-out infinite; }
    .int-m { animation: dkM3n 7s ease-in-out infinite; }

    @keyframes openL3n {
      0%, 12%  { transform: scaleX(1) skewY(0deg); }
      38%, 55% { transform: scaleX(0.3) skewY(-6deg); }
      85%, 100%{ transform: scaleX(1) skewY(0deg); }
    }
    @keyframes openR3n {
      0%, 12%  { transform: scaleX(1) skewY(0deg); }
      38%, 55% { transform: scaleX(0.3) skewY(6deg); }
      85%, 100%{ transform: scaleX(1) skewY(0deg); }
    }
    @keyframes tiltM3n {
      0%, 22%  { transform: scaleY(1) scaleX(1); }
      48%, 65% { transform: scaleY(0.9) scaleX(1.04); }
      92%, 100%{ transform: scaleY(1) scaleX(1); }
    }
    @keyframes dkL3n { 0%, 12% { opacity: 0; } 38%, 55% { opacity: 1; } 85%, 100% { opacity: 0; } }
    @keyframes dkR3n { 0%, 12% { opacity: 0; } 38%, 55% { opacity: 1; } 85%, 100% { opacity: 0; } }
    @keyframes dkM3n { 0%, 22% { opacity: 0; } 48%, 65% { opacity: 0.55; } 92%, 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .sash-l, .sash-r, .sash-m, .int-l, .int-r, .int-m { animation: none; }
    }
  </style>

  <!-- Outer frame -->
  <g filter="url(#softShadow)">
    <rect x="28" y="30" width="584" height="500" rx="6" fill="url(#frameOuter)" stroke="#c7ccd2" stroke-width="1.5"/>
  </g>
  <rect x="48" y="52" width="544" height="456" rx="4" fill="url(#frameInner)" stroke="#c2c8ce" stroke-width="1"/>
  <rect x="56" y="60" width="528" height="440" rx="3" fill="none" stroke="#aeb5bc" stroke-width="1.5"/>

  <!-- Дотор орчин (хавтас бүрийн ард) -->
  <rect class="int-l" x="60"  y="64" width="160" height="432" fill="#2a3242" opacity="0"/>
  <rect class="int-m" x="234" y="64" width="172" height="432" fill="#2a3242" opacity="0"/>
  <rect class="int-r" x="420" y="64" width="160" height="432" fill="#2a3242" opacity="0"/>

  <!-- Хоёр голын хуваалт -->
  <rect x="220" y="64" width="14" height="432" fill="url(#frameOuter)" stroke="#bfc5cb" stroke-width="1"/>
  <rect x="406" y="64" width="14" height="432" fill="url(#frameOuter)" stroke="#bfc5cb" stroke-width="1"/>

  <!-- ЗҮҮН нарийн хавтас -->
  <g class="sash-l">
    <rect x="60" y="64" width="160" height="432" rx="3" fill="url(#sash)" stroke="#bfc5cb" stroke-width="1.5"/>
    <rect x="76" y="80" width="128" height="400" rx="2" fill="#eef1f4" stroke="#b4bac1" stroke-width="1"/>
    <rect x="83" y="87" width="114" height="386" fill="url(#glass)" stroke="#9fb3c6" stroke-width="1"/>
    <polygon points="83,87 128,87 97,473 83,473" fill="url(#glassSheen)"/>
    <polygon points="142,87 162,87 116,473 102,473" fill="#ffffff" opacity="0.22"/>
    <rect x="54" y="105" width="8" height="30" rx="2" fill="#d6dade" stroke="#b0b6bc" stroke-width="0.8"/>
    <rect x="54" y="425" width="8" height="30" rx="2" fill="#d6dade" stroke="#b0b6bc" stroke-width="0.8"/>
    <g filter="url(#tinyShadow)">
      <rect x="201" y="260" width="12" height="22" rx="4" fill="url(#handle)" stroke="#b8bec5" stroke-width="1"/>
      <rect x="204" y="270" width="6" height="58" rx="3" fill="url(#handle)" stroke="#b8bec5" stroke-width="1"/>
    </g>
  </g>

  <!-- ГОЛЫН нарийн хавтас — tilt, хэвтээ бариул доор -->
  <g class="sash-m">
    <rect x="234" y="64" width="172" height="432" rx="3" fill="url(#sash)" stroke="#bfc5cb" stroke-width="1.5"/>
    <rect x="250" y="80" width="140" height="400" rx="2" fill="#eef1f4" stroke="#b4bac1" stroke-width="1"/>
    <rect x="257" y="87" width="126" height="386" fill="url(#glass)" stroke="#9fb3c6" stroke-width="1"/>
    <polygon points="257,87 306,87 272,473 257,473" fill="url(#glassSheen)"/>
    <polygon points="322,87 344,87 294,473 278,473" fill="#ffffff" opacity="0.22"/>
    <g filter="url(#tinyShadow)">
      <rect x="309" y="474" width="22" height="12" rx="4" fill="url(#handle)" stroke="#b8bec5" stroke-width="1"/>
      <rect x="291" y="477" width="58" height="6" rx="3" fill="url(#handle)" stroke="#b8bec5" stroke-width="1"/>
    </g>
  </g>

  <!-- БАРУУН нарийн хавтас -->
  <g class="sash-r">
    <rect x="420" y="64" width="160" height="432" rx="3" fill="url(#sash)" stroke="#bfc5cb" stroke-width="1.5"/>
    <rect x="436" y="80" width="128" height="400" rx="2" fill="#eef1f4" stroke="#b4bac1" stroke-width="1"/>
    <rect x="443" y="87" width="114" height="386" fill="url(#glass)" stroke="#9fb3c6" stroke-width="1"/>
    <polygon points="443,87 488,87 457,473 443,473" fill="url(#glassSheen)"/>
    <polygon points="502,87 522,87 476,473 462,473" fill="#ffffff" opacity="0.22"/>
    <rect x="578" y="105" width="8" height="30" rx="2" fill="#d6dade" stroke="#b0b6bc" stroke-width="0.8"/>
    <rect x="578" y="425" width="8" height="30" rx="2" fill="#d6dade" stroke="#b0b6bc" stroke-width="0.8"/>
    <g filter="url(#tinyShadow)">
      <rect x="427" y="260" width="12" height="22" rx="4" fill="url(#handle)" stroke="#b8bec5" stroke-width="1"/>
      <rect x="430" y="270" width="6" height="58" rx="3" fill="url(#handle)" stroke="#b8bec5" stroke-width="1"/>
    </g>
  </g>
</svg>
